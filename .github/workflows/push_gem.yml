name: Push Gem

# Pushing a version tag, which `rake release` does, checks the tag with CI and then pushes the gem to RubyGems.org
# with trusted publishing
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docs:
    uses: ./.github/workflows/docs.yml
  lint:
    uses: ./.github/workflows/lint.yml
  mutant:
    uses: ./.github/workflows/mutant.yml
  steep:
    uses: ./.github/workflows/steep.yml
  test:
    uses: ./.github/workflows/test.yml

  push:
    needs: [docs, lint, mutant, steep, test]
    if: github.repository == 'sferik/sferik-ruby'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Set up
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          bundler-cache: true
          ruby-version: ruby

      # The release task tags the version it builds when that tag is missing, so a tag that names another version
      # would push a gem and a tag nobody asked for
      - name: Check that the tag names the version
        run: ruby -r ./lib/sferik/version -e 'abort "#{ARGV[0]} is not v#{Sferik::VERSION}" unless ARGV[0] == "v#{Sferik::VERSION}"' "$GITHUB_REF_NAME"

      # Release
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
